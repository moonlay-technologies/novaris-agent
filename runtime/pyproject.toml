[project]
name = "novaris-runtime"
version = "0.1.0"
description = "Novaris local AI agent runtime (LangChain Deep Agents)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents==0.7.23",
    "langchain-openai",
    "langgraph-checkpoint-sqlite",
    "websockets",
    "httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pyinstaller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novaris_runtime"]
